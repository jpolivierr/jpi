pathLayouts: 
  - id: "domain"
    paths:
      - "/application"
      - "/interface"

packages:
  mapper: appvenir.application.mapper
  service: appvenir.application.service
  useCase: appvenir.application.useCase
  controller: appvenir.interfaces.controller
  repository: appvenir.infrastructure.repository
  config: appvenir.infrastructure.config
  securityConfig: appvenir.infrastructure.config
  security: appvenir.infrastructure.security

packageGroups:
  - id: "clean"
    packages:
      mapper: appvenir.application.mapper
      service: appvenir.application.service
      useCase: appvenir.application.useCase
      controller: appvenir.interfaces.controller
      repository: appvenir.infrastructure.repository
      config: appvenir.infrastructure.config
      securityConfig: appvenir.infrastructure.config
      security: appvenir.infrastructure.security
      
  - id: "layered"
    packages:
      mapper: appvenir.mapper
      service: appvenir.service
      useCase: appvenir.useCase
      controller: appvenir.controller
      repository: appvenir.repository
      config: appvenir.config
      securityConfig: appvenir.config
      security: appvenir.security
